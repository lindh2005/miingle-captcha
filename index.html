<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Miingle — verifikation</title>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      background: transparent;
      display: flex;
      align-items: center;
      justify-content: center;
      height: 100%;
      overflow: hidden;
    }
  </style>
</head>
<body>
  <div id="turnstile-container"></div>

  <script>
    // Sender resultatet tilbage til React Native-appen der har denne side i en WebView.
    function postTilApp(payload) {
      if (window.ReactNativeWebView) {
        window.ReactNativeWebView.postMessage(JSON.stringify(payload));
      }
    }

    window.onloadTurnstileCallback = function () {
      turnstile.render('#turnstile-container', {
        // TODO: udskift med din rigtige Cloudflare Turnstile site key (se README.md i denne mappe)
        sitekey: '0x4AAAAAAAEzAP3CqADxtTksu',
        appearance: 'interaction-only', // usynlig for de fleste — vises kun ved mistænkelig trafik
        callback: function (token) {
          postTilApp({ type: 'success', token: token });
        },
        'error-callback': function () {
          postTilApp({ type: 'error' });
        },
        'expired-callback': function () {
          postTilApp({ type: 'expired' });
        },
      });
    };
  </script>
  <script src="https://challenges.cloudflare.com/turnstile/v0/api.js?onload=onloadTurnstileCallback" async defer></script>
</body>
</html>
